# Phase 0：事件喚醒測試。由 GITHUB_TOKEN 建立 Issue 或留言，看 Claude／Codex 會不會被叫醒。
# 需合併進 main 後才能用 workflow_dispatch 執行。Phase 1 前可刪除。
name: wake-test
on:
  workflow_dispatch:
    inputs:
      target:
        description: 喚醒對象（claude-issue＝開 [wake-test] Issue；codex-comment＝在 PR 留 @codex 留言）
        type: choice
        options:
          - claude-issue
          - codex-comment
        default: claude-issue
      number:
        description: codex-comment 時要留言的 PR 編號（claude-issue 免填）
        required: false
        default: ''
permissions:
  contents: read
  issues: write
  pull-requests: write
jobs:
  wake:
    runs-on: ubuntu-latest
    steps:
      - name: Create a [wake-test] issue (for Claude GitHub trigger)
        if: inputs.target == 'claude-issue'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TS=$(TZ=Asia/Taipei date +%Y-%m-%dT%H:%M:%S%:z)
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "[wake-test] $TS" \
            --body "Phase 0 事件喚醒測試，由 GITHUB_TOKEN 建立。請不要處理這個 Issue。"
      - name: Comment @codex on a PR (for Codex mention)
        if: inputs.target == 'codex-comment'
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ inputs.number }}
        run: |
          case "$NUMBER" in ''|*[!0-9]*) echo "number 必須是 PR 編號（純數字）"; exit 1;; esac
          gh pr comment "$NUMBER" --repo "$GITHUB_REPOSITORY" \
            --body "@codex 這是事件喚醒測試。請只回覆「收到」，不要修改任何檔案，不要建立分支或 PR。"
