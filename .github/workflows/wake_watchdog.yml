# 喚醒看門狗：steward_finish.sh 開完 [wake-claude-X] Issue 後 dispatch。確認 Claude 真的有動作，沒有就重派（最多 3 次）。
# 不碰 state.json，只開／關 Issue；concurrency 群組與 steward 分開，等待時不會卡住總管。同一組（階段＋輪次＋attempt）只留最新一個。
name: wake-watchdog
on:
  workflow_dispatch:
    inputs:
      stage:
        description: 階段（A 或 C）
        required: true
      round:
        description: 四位數輪次
        required: true
      attempt:
        description: attempt
        required: true
permissions:
  contents: read
  issues: write
concurrency:
  group: watchdog-${{ inputs.stage }}-${{ inputs.round }}-${{ inputs.attempt }}
  cancel-in-progress: true
env:
  TZ: Asia/Taipei
  GH_TOKEN: ${{ github.token }}
jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Watch
        env:
          IN_STAGE: ${{ inputs.stage }}
          IN_ROUND: ${{ inputs.round }}
          IN_ATTEMPT: ${{ inputs.attempt }}
        run: python3 scripts/wake_watchdog.py --stage "$IN_STAGE" --round "$IN_ROUND" --attempt "$IN_ATTEMPT"
