# 逾時偵測（HANDOFF §8.1「基礎設施」）：status=waiting 且超過 deadline_at → 記「停滯」並開 Issue，不計 attempt。
# 每小時一次；也是排程輪詢型 AI 的保險（Public repo 60 天沒活動 GitHub 會自動停用排程，恢復後再啟用即可）。
name: stall-check
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  issues: write
  pull-requests: write
concurrency:
  group: steward
  cancel-in-progress: false
env:
  TZ: Asia/Taipei
  GH_TOKEN: ${{ github.token }}
jobs:
  stall:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check
        run: |
          set -euo pipefail
          export NOW="$(date +%Y-%m-%dT%H:%M:%S%:z)"; echo "NOW=$NOW" >> "$GITHUB_ENV"
          python3 scripts/steward.py stall-check --repo . --now "$NOW" --actions "$RUNNER_TEMP/actions.json"
      - name: Commit and post actions
        run: bash scripts/steward_finish.sh "$RUNNER_TEMP/actions.json" "stall check"
