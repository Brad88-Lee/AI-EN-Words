# Phase 0 通訊測試：驗證 workflow_dispatch / repository_dispatch 與「GITHUB_TOKEN 發出的 repository_dispatch 會觸發下一個 run」。
# 每次被觸發就在 test/ping.md 追加一行。Phase 1 前可刪除。
name: ping
on:
  workflow_dispatch:
    inputs:
      note:
        description: 備註
        required: false
        default: ''
      chain:
        description: 送出 repository_dispatch（ping）串接測試：預期再多 2 行 ping-chain-1、ping-chain-2
        type: boolean
        default: false
  repository_dispatch:
    types: [ping, ping-chain-1, ping-chain-2]
permissions:
  contents: write
concurrency:
  group: ping
  cancel-in-progress: false
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Append a line to test/ping.md
        env:
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          ACTOR: ${{ github.actor }}
          NOTE: ${{ github.event.inputs.note }}
        run: |
          mkdir -p test
          TS=$(TZ=Asia/Taipei date +%Y-%m-%dT%H:%M:%S%:z)
          echo "[$TS] event=$EVENT action=${ACTION:--} actor=$ACTOR note=${NOTE:--}" >> test/ping.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add test/ping.md
          git commit -m "ping: $EVENT $ACTION"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
      - name: Start the chain from a manual run (GITHUB_TOKEN sends repository_dispatch)
        if: github.event_name == 'workflow_dispatch' && inputs.chain
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/${GITHUB_REPOSITORY}/dispatches" -f event_type=ping
      - name: Chain to the next ping (tests repository_dispatch with GITHUB_TOKEN)
        if: github.event.action == 'ping' || github.event.action == 'ping-chain-1'
        env:
          GH_TOKEN: ${{ github.token }}
          NEXT: ${{ github.event.action == 'ping' && 'ping-chain-1' || 'ping-chain-2' }}
        run: gh api "repos/${GITHUB_REPOSITORY}/dispatches" -f event_type="$NEXT"
